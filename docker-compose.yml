

services:
  # --- Database Service ---
  mongodb-container:
    image: mongo:latest
    container_name: mongodb-container
    ports:
      - "${DB_PORT}:27017"
      # ping instruciton
    healthcheck:
      test: ["CMD", "mongosh","--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 2s
      retries: 3

    environment:
      # These variables tell MongoDB to set up a username and password
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db # Persistent named volume for data safety
    networks:
      - docker-app-network

  # --- Database GUI Service ---
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb-container # Connects to DB via network
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - docker-app-network
    depends_on:
      mongodb-container:
        condition: service_healthy

  # --- Backend Service (Flask) ---
  user-service:
    build: ./user-service # Path to the backend Dockerfile
    container_name: user-service-container
    ports:
      - "${USER_SERVICE_PORT}:5000"
    environment:
    # Passing the DB credentials to Python container
    - DB_USER=${MONGO_INITDB_ROOT_USERNAME}
    - DB_PASS=${MONGO_INITDB_ROOT_PASSWORD}
    - DB_HOST=${DB_HOST}
    - JWT_SECRET_KEY=${JWT_SECRET_KEY} 
    volumes:
      - ./user-service:/app # Bind mount: synchronizes local code changes instantly
    networks:
      - docker-app-network
    depends_on:
      mongodb-container:
        condition: service_healthy
    restart: unless-stopped    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'  
          memory: 128M
    image: shahrambackend/user-service:v1.0
  #Authentication Service (C#)    
  auth-service:
    build: ./auth-service # path to the backend C# Dockerfile
    container_name: auth-service-container
    networks:
      - docker-app-network
    environment:
    - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      mongodb-container:
        condition: service_healthy
    image: shahrambackend/user-service:v1.0

  # --- Frontend Service (Nginx) ---
  frontend:
    build: ./frontend # Path to the frontend Dockerfile
    container_name: frontend-container
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      # 1. Map your static website files (HTML, CSS, JS) to Nginx public folder
      - ./frontend:/usr/share/nginx/html
      
      # 2. Map your custom Nginx configuration file to override the default one
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - docker-app-network
    depends_on:
      - auth-service
      - user-service
    image: shahrambackend/user-service:v1.0


  # Monitoring Services
  # -----------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-container
    volumes:
      # Mount the config file we just created
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:9090"
    restart: unless-stopped
    networks:
      - docker-app-network  

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-container
    environment:
      # Default admin password for first login
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - docker-app-network  

  telegraf:
    image: telegraf:latest
    container_name: telegraf-container
    user: root
    privileged: true
    entrypoint: ["telegraf"]
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9273:9273"
    networks:
      - docker-app-network
    restart: unless-stopped
# --- Global Named Volumes Definition ---
volumes:
  mongo-data:
  grafana_data:

# --- Global Networks Definition ---
networks:
  docker-app-network:

  