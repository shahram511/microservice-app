[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"

# تنظیمات ورودی: اتصال به سوکت داکر
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  timeout = "5s"

# تنظیمات خروجی: آماده‌سازی دیتا برای پرومتئوس
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2